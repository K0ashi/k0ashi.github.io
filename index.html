async function addEv(){

 if(R==='cycle'){row.n=+F.n;row.m=+F.m;if(!(row.n>=1&&row.m>=1))return toast('Укажи рабочие дни и выходные')}

async function addAct(){var n=$('an').value.trim();if(!n)return;var c=['#a9c8f0','#f2b8c6','#b4e0cc','#f5cfa8','#cdbdf0','#f1e3a1'][A.length%6];await sb.from('activities').insert({id:'c'+Date.now(),name:n,icon:$('ai').value.trim()||'⭐',color:c,sort:A.length+1});load()}
function pl(id){return PL.find(function(p){return p.id===id})}
function dist(a,b){var R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dg=(b.lng-a.lng)*r,x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dg/2)*Math.sin(dg/2);return 2*R*Math.asin(Math.sqrt(x))}
function leg(a,b){var H={lat:S.home_lat,lng:S.home_lng},pa=a==='H'?H:a,pb=b==='H'?H:b;
 if(a==='H'&&b!=='H'&&b.home_min!=null)return b.home_min;if(b==='H'&&a!=='H'&&a.home_min!=null)return a.home_min;
 if(pa.lat==null||pb.lat==null)return 10;return Math.max(1,Math.round(dist(pa,pb)*1.3/4.5*60))}
function calc(ids,i){var P=ids.map(pl).filter(Boolean),n=P.length;if(!n)return 0;if(i>=n)return leg(P[n-1],'H');
 var t=leg(i===0?'H':P[i-1],P[i]);for(var k=i;k<n;k++){t+=P[k].stay_min||0;t+=k<n-1?leg(P[k],P[k+1]):leg(P[k],'H')}return t}

async function delPast(){var t=new Date().toISOString().slice(0,10),ids=D.filter(function(e){return ((!e.rule||e.rule==='once')&&e.day<t)||(e.until_day&&e.until_day<t)}).map(function(e){return e.id});if(!ids.length)return toast('Прошедших нет');if(!confirm('Удалить прошедшие ('+ids.length+')?'))return;await sb.from('schedule').delete().in('id',ids);load()}
